<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Compost Industrial Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: #111726;
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --color-temp: #38bdf8;
            --color-humi: #f43f5e;
            --color-fan: #10b981;
        }
                                                                  
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
        }

        h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; }

        .btn-connect {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 0.625rem 1.25rem;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-connect:hover { background-color: #1d4ed8; }
        .btn-connect.connected { background-color: #dc2626; }

        .grid-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.25rem;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 1.25rem;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0.5rem 0;
        }

        #metric-temp .card-value { color: var(--color-temp); }
        #metric-humi .card-value { color: var(--color-humi); }
        #metric-fan .card-value { color: var(--text-muted); }

        .status-pill {
            display: inline-block;
            align-self: flex-start;
            padding: 0.25rem 0.625rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 700;
            background-color: #334155;
            color: #94a3b8;
        }
        .active-pill { background-color: rgba(16, 185, 129, 0.15); color: var(--color-fan); }

        .grid-charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 1.25rem;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 1.25rem;
        }

        @media (max-width: 600px) {
            .grid-charts { grid-template-columns: 1fr; }
        }

        .chart-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.25rem;
            height: 320px;
        }

        .console {
            width: 100%;
            max-width: 1200px;
            background-color: #020617;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 0.75rem;
            font-family: monospace;
            font-size: 0.75rem;
            color: #38bdf8;
            max-height: 80px;
            overflow-y: auto;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>3D Printed Smart Composting System</h1>
            <p style="color: var(--text-muted); margin: 0.25rem 0 0 0; font-size: 0.75rem;">UART Hardware Telemetry Pipeline</p>
        </div>
        <button id="connectBtn" class="btn-connect" onclick="toggleSerial()">Connect Station</button>
    </header>

    <div class="grid-metrics">
        <div class="card" id="metric-temp">
            <div class="card-label">Core Temperature</div>
            <div class="card-value" id="tempText">--.- °C</div>
            <div class="status-pill">DS18B20 Node</div>
        </div>
        <div class="card" id="metric-humi">
            <div class="card-label">Headspace Humidity</div>
            <div class="card-value" id="humiText">--.- %</div>
            <div class="status-pill">DHT22 Node</div>
        </div>
        <div class="card" id="metric-fan">
            <div class="card-label">AECS Ventilation State</div>
            <div class="card-value" id="fanText">STANDBY</div>
            <div id="fanPill" class="status-pill">Transistor Logic</div>
        </div>
    </div>

    <div class="grid-charts">
        <div class="chart-box">
            <canvas id="envChart"></canvas>
        </div>
        <div class="chart-box">
            <canvas id="fanChart"></canvas>
        </div>
    </div>

    <div class="console" id="serialConsole">>> System initialized. Ready to hook physical COM channel port...</div>

    <script>
        let port;
        let reader;
        let buffer = "";
        
        // Rolling Data Window Capacity Constraint
        const MAX_DATA_POINTS = 40;

        // --- CHART 1 SETUP: Environmental Multi-Axis Tracking ---
        const envCtx = document.getElementById('envChart').getContext('2d');
        const envChart = new Chart(envCtx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Core Temperature (°C)',
                        borderColor: '#38bdf8',
                        backgroundColor: 'rgba(56, 189, 248, 0.05)',
                        borderWidth: 2,
                        pointRadius: 1.5,
                        data: [],
                        yAxisID: 'yTemp'
                    },
                    {
                        label: 'Humidity (%)',
                        borderColor: '#f43f5e',
                        backgroundColor: 'rgba(244, 63, 94, 0.05)',
                        borderWidth: 2,
                        pointRadius: 1.5,
                        data: [],
                        yAxisID: 'yHumi'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#94a3b8', font: { size: 11, weight: 'bold' } } } },
                scales: {
                    x: { ticks: { color: '#64748b', maxRotation: 0 }, grid: { color: 'rgba(255,255,255,0.03)' } },
                    yTemp: { type: 'linear', position: 'left', title: { display: true, text: 'Temp °C', color: '#38bdf8' }, ticks: { color: '#38bdf8' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                    yHumi: { type: 'linear', position: 'right', title: { display: true, text: 'Humidity %', color: '#f43f5e' }, ticks: { color: '#f43f5e' }, grid: { display: false } }
                }
            }
        });

        // --- CHART 2 SETUP: Operational State History (Stepped) ---
        const fanCtx = document.getElementById('fanChart').getContext('2d');
        const fanChart = new Chart(fanCtx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Ventilation Motor Output State (0=OFF, 1=ON)',
                    borderColor: '#10b981',
                    backgroundColor: 'rgba(16, 185, 129, 0.08)',
                    borderWidth: 2,
                    pointRadius: 0,
                    stepped: true, // Forces solid logic block square waves
                    fill: true,
                    data: []
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#94a3b8', font: { size: 11, weight: 'bold' } } } },
                scales: {
                    x: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.03)' } },
                    y: { min: -0.1, max: 1.1, ticks: { stepSize: 1, color: '#10b981', callback: function(v) { return v === 1 ? 'ON' : v === 0 ? 'OFF' : ''; } }, grid: { color: 'rgba(255,255,255,0.05)' } }
                }
            }
        });

        // --- SERIAL PORT PIPELINE MANAGEMENT ---
        async function toggleSerial() {
            const btn = document.getElementById('connectBtn');
            const consoleBox = document.getElementById('serialConsole');

            if (port) {
                try { reader.cancel(); await port.close(); } catch(e){}
                port = null;
                btn.innerText = "Connect Station";
                btn.classList.remove('connected');
                consoleBox.innerText = ">> Connection terminated.";
                return;
            }

            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                btn.innerText = "Disconnect";
                btn.classList.add('connected');
                consoleBox.innerText = ">> Channel established. Streaming processing loop active...\n";

                const decoder = new TextDecoderStream();
                port.readable.pipeTo(decoder.writable);
                reader = decoder.readable.getReader();

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) {
                        buffer += value;
                        let frames = buffer.split("\n");
                        buffer = frames.pop(); 

                        for (let frame of frames) {
                            frame = frame.trim();
                            if (frame.startsWith("{") && frame.endsWith("}")) {
                                try {
                                    const telemetry = JSON.parse(frame);
                                    processTelemetry(telemetry, frame);
                                } catch(e){}
                            }
                        }
                    }
                }
            } catch (err) {
                consoleBox.innerText = ">> Error: " + err.message;
                port = null;
                btn.innerText = "Connect Station";
                btn.classList.remove('connected');
            }
        }

        function processTelemetry(data, rawFrame) {
            const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            // 1. Update Core Metric Text Elements
            if (data.temp !== undefined) document.getElementById('tempText').innerText = data.temp.toFixed(1) + " °C";
            if (data.humi !== undefined) document.getElementById('humiText').innerText = data.humi.toFixed(1) + " %";
            
            const fanText = document.getElementById('fanText');
            const fanPill = document.getElementById('fanPill');
            if (data.fan === 1) {
                fanText.innerText = "RUNNING";
                fanText.style.color = "var(--color-fan)";
                fanPill.innerText = "AECS Active Ventilation";
                fanPill.classList.add('active-pill');
            } else {
                fanText.innerText = "STANDBY";
                fanText.style.color = "var(--text-muted)";
                fanPill.innerText = "System Idle";
                fanPill.classList.remove('active-pill');
            }

            // 2. Push Real-Time Tracking Arrays into Graphical Series
            // Environmental Canvas
            envChart.data.labels.push(timestamp);
            envChart.data.datasets[0].data.push(data.temp);
            envChart.data.datasets[1].data.push(data.humi);

            // Transistor Logic Canvas
            fanChart.data.labels.push(timestamp);
            fanChart.data.datasets[0].data.push(data.fan);

            // 3. Shift FIFO Arrays to maintain clean screen estate space limits
            if (envChart.data.labels.length > MAX_DATA_POINTS) {
                envChart.data.labels.shift();
                envChart.data.datasets[0].data.shift();
                envChart.data.datasets[1].data.shift();

                fanChart.data.labels.shift();
                fanChart.data.datasets[0].data.shift();
            }

            // 4. Force Graphical Engine Re-renders
            envChart.update('none');
            fanChart.update('none');

            // 5. Append Line to Activity Logger Terminal
            const consoleBox = document.getElementById('serialConsole');
            consoleBox.innerText = `[${timestamp}] RX RX: ${rawFrame}\n` + consoleBox.innerText.slice(0, 300);
        }
    </script>
</body>
</html>
